<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Intellistay proactive AI concierge technical architecture</title>
<desc id="desc">Layered architecture showing guest and hotel channels, identity and tenancy, AI orchestration, domain services, data stores, integrations, and security controls.</desc>
<defs><style>
text{font-family:Inter,Arial,sans-serif;fill:#153b32}.title{font-size:26px;font-weight:700}.sub{font-size:13px;fill:#6f7772}.lane{fill:#f5f0e6;stroke:#7f9b8c;stroke-width:2}.laneTitle{font-size:14px;font-weight:700;letter-spacing:1px}.node{fill:#fffdf8;stroke:#7f9b8c;stroke-width:2}.live{fill:#153b32;stroke:#153b32}.soft{fill:#eadfca;stroke:#7f9b8c}.guard{fill:#f8ece6;stroke:#b96f52}.future{fill:#fffdf8;stroke:#7f9b8c;stroke-width:2;stroke-dasharray:8 6}.nt{font-size:14px;font-weight:700}.nb{font-size:11px;fill:#6f7772}.white{fill:#fffdf8}.white2{fill:#eadfca}.arrow{fill:none;stroke:#153b32;stroke-width:2;marker-end:url(#a)}.dashed{stroke:#7f9b8c;stroke-dasharray:7 6}.security{font-size:12px;font-weight:700}
</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153b32"/></marker></defs>
<rect width="1600" height="1180" fill="#fffdf8"/><text x="50" y="45" class="title">INTELLISTAY  |  PROACTIVE AI CONCIERGE  |  TECHNICAL ARCHITECTURE</text><text x="50" y="72" class="sub">Solid forest nodes are functional in the demo. Dashed nodes are production integrations. Guest and hotel roles remain separated.</text>
<g transform="translate(50 100)"><rect class="lane" width="1500" height="135" rx="18"/><text x="20" y="26" class="laneTitle">EXPERIENCE CHANNELS</text><g transform="translate(30 45)"><rect class="live" width="410" height="65" rx="14"/><text x="20" y="27" class="nt white">Guest mobile web / PWA</text><text x="20" y="47" class="nb white2">Room selection, check-in, concierge, requests, checkout</text></g><g transform="translate(545 45)"><rect class="live" width="410" height="65" rx="14"/><text x="20" y="27" class="nt white">Hotel operations mobile / desktop</text><text x="20" y="47" class="nb white2">Property login, queue, SLA, feedback, reports, analyst</text></g><g transform="translate(1060 45)"><rect class="future" width="410" height="65" rx="14"/><text x="20" y="27" class="nt">Partner administration  [production]</text><text x="20" y="47" class="nb">Property onboarding, catalogues, roles, policies</text></g></g>
<g transform="translate(50 255)"><rect class="lane" width="1500" height="140" rx="18"/><text x="20" y="27" class="laneTitle">IDENTITY, TENANCY AND TRUST</text><g transform="translate(30 48)"><rect class="soft" width="300" height="68" rx="14"/><text x="18" y="27" class="nt">CDN, WAF and API gateway</text><text x="18" y="48" class="nb">TLS, rate limits, request validation</text></g><g transform="translate(360 48)"><rect class="node" width="300" height="68" rx="14"/><text x="18" y="27" class="nt">Guest verification</text><text x="18" y="48" class="nb">Property + reservation + contact recovery</text></g><g transform="translate(690 48)"><rect class="future" width="300" height="68" rx="14"/><text x="18" y="27" class="nt">Staff identity  [production]</text><text x="18" y="48" class="nb">SSO, MFA, domain check, RBAC</text></g><g transform="translate(1020 48)"><rect class="live" width="450" height="68" rx="14"/><text x="18" y="27" class="nt white">Tenant resolver and partner registry</text><text x="18" y="48" class="nb white2">Property-scoped data and service configuration</text></g></g>
<g transform="translate(50 415)"><rect class="lane" width="1500" height="180" rx="18"/><text x="20" y="27" class="laneTitle">AI ORCHESTRATION AND CONTROL PLANE</text><g transform="translate(30 52)"><rect class="node" width="255" height="100" rx="14"/><text x="18" y="27" class="nt">Event intake</text><text x="18" y="49" class="nb">Guest actions, hotel updates,</text><text x="18" y="67" class="nb">itinerary, weather, consent</text></g><g transform="translate(320 52)"><rect class="node" width="255" height="100" rx="14"/><text x="18" y="27" class="nt">Context assembler</text><text x="18" y="49" class="nb">Stay, room, history, interests,</text><text x="18" y="67" class="nb">property capabilities</text></g><g transform="translate(610 52)"><rect class="guard" width="255" height="100" rx="14"/><text x="18" y="27" class="nt">Policy and consent engine</text><text x="18" y="49" class="nb">Allowed tools, sensitive data,</text><text x="18" y="67" class="nb">approval thresholds</text></g><g transform="translate(900 52)"><rect class="live" width="255" height="100" rx="14"/><text x="18" y="27" class="nt white">Intent + workflow planner</text><text x="18" y="49" class="nb white2">Recommend, draft, sequence,</text><text x="18" y="67" class="nb white2">escalate, recover</text></g><g transform="translate(1190 52)"><rect class="soft" width="280" height="100" rx="14"/><text x="18" y="27" class="nt">Tool executor + gate</text><text x="18" y="49" class="nb">Confirmation, retry, idempotency,</text><text x="18" y="67" class="nb">audit event</text></g></g>
<g transform="translate(50 615)"><rect class="lane" width="1500" height="220" rx="18"/><text x="20" y="27" class="laneTitle">DOMAIN SERVICES</text><g transform="translate(30 50)"><rect class="live" width="260" height="70" rx="14"/><text x="18" y="28" class="nt white">Stay lifecycle</text><text x="18" y="49" class="nb white2">Room, check-in, in-stay, checkout</text></g><g transform="translate(320 50)"><rect class="live" width="260" height="70" rx="14"/><text x="18" y="28" class="nt white">Request orchestration</text><text x="18" y="49" class="nb white2">Routing, status, SLA, reminders</text></g><g transform="translate(610 50)"><rect class="live" width="260" height="70" rx="14"/><text x="18" y="28" class="nt white">Discovery + mobility</text><text x="18" y="49" class="nb white2">Nearby categories and map links</text></g><g transform="translate(900 50)"><rect class="node" width="260" height="70" rx="14"/><text x="18" y="28" class="nt">Guest communication</text><text x="18" y="49" class="nb">In-app, push, email, SMS</text></g><g transform="translate(1190 50)"><rect class="node" width="280" height="70" rx="14"/><text x="18" y="28" class="nt">Feedback + recovery</text><text x="18" y="49" class="nb">Concern detection and response</text></g><g transform="translate(175 140)"><rect class="node" width="320" height="55" rx="14"/><text x="18" y="23" class="nt">Billing and documents</text><text x="18" y="42" class="nb">Folio, invoice, PDF, email</text></g><g transform="translate(590 140)"><rect class="node" width="360" height="55" rx="14"/><text x="18" y="23" class="nt">Operations intelligence</text><text x="18" y="42" class="nb">Queue, FTR, resolution, feedback, MIS</text></g><g transform="translate(1045 140)"><rect class="guard" width="330" height="55" rx="14"/><text x="18" y="23" class="nt">Audit and observability</text><text x="18" y="42" class="nb">Action log, model trace, cost, quality</text></g></g>
<g transform="translate(50 855)"><rect class="lane" width="1500" height="265" rx="18"/><text x="20" y="27" class="laneTitle">DATA, INTEGRATIONS AND SECURITY</text><g transform="translate(30 52)"><rect class="future" width="270" height="75" rx="14"/><text x="18" y="28" class="nt">Postgres  [production]</text><text x="18" y="50" class="nb">Tenant-aware operational records</text></g><g transform="translate(330 52)"><rect class="future" width="270" height="75" rx="14"/><text x="18" y="28" class="nt">Event bus  [production]</text><text x="18" y="50" class="nb">Durable events, timers, retries</text></g><g transform="translate(630 52)"><rect class="live" width="270" height="75" rx="14"/><text x="18" y="28" class="nt white">Demo session state</text><text x="18" y="50" class="nb white2">Browser memory + session storage</text></g><g transform="translate(930 52)"><rect class="future" width="240" height="75" rx="14"/><text x="18" y="28" class="nt">PMS / CRS  [production]</text><text x="18" y="50" class="nb">Room and stay inventory</text></g><g transform="translate(1200 52)"><rect class="future" width="270" height="75" rx="14"/><text x="18" y="28" class="nt">External tools  [production]</text><text x="18" y="50" class="nb">Payments, CRM, travel, IoT, messages</text></g><g transform="translate(930 145)"><rect class="soft" width="540" height="55" rx="14"/><text x="18" y="23" class="nt">Maps links  [functional]</text><text x="18" y="42" class="nb">Google Maps URLs + Apple Map Links</text></g><g transform="translate(30 145)"><rect class="guard" width="870" height="82" rx="14"/><text x="18" y="26" class="security">CROSS-CUTTING SECURITY</text><text x="18" y="49" class="nb">Encryption in transit and at rest  |  Secrets  |  Consent ledger  |  Data minimization</text><text x="18" y="67" class="nb">Retention  |  Tenant isolation  |  Monitoring  |  Human approval for consequential actions</text></g></g>
<path class="arrow" d="M255 235V255"/><path class="arrow" d="M800 235V255"/><path class="arrow" d="M1300 395V415H177"/><path class="arrow" d="M335 595V615"/><path class="arrow" d="M755 595V615"/><path class="arrow" d="M1040 595V615"/><path class="arrow" d="M180 835V855"/><path class="arrow dashed" d="M470 835V855"/><path class="arrow" d="M760 835V855"/>
</svg>
